name: CI

on:
  push:
    branches: [master, main, "claude/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Types · Unit tests · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  # Contract tests: the frontend production build against the real Django API.
  # The API repository is private: add a read-only token as the
  # API_REPO_TOKEN secret (falls back to GITHUB_TOKEN for public repos).
  e2e:
    name: E2E against Django API (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: webspeed
          POSTGRES_USER: webspeed
          POSTGRES_PASSWORD: webspeed
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U webspeed" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      API_INTERNAL_URL: http://localhost:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MErfanPld/webspeed-eshop-api
          ref: main
          path: api
          token: ${{ secrets.API_REPO_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements/*.txt
      - name: Start Django API
        working-directory: api
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef
          DATABASE_URL: postgres://webspeed:webspeed@localhost:5432/webspeed
          REDIS_URL: redis://localhost:6379/0
          STORAGE_BACKEND: local
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3100
          CSRF_TRUSTED_ORIGINS: http://localhost:3100
          ADMIN_EMAIL: admin@webspeed.local
          ADMIN_PASSWORD: admin12345
          # paid services run in test mode (output in /tmp/api.log)
          SMS_BACKEND: console
          PAYMENT_PROVIDER: mock
          FRONTEND_URL: http://localhost:3100
          API_PUBLIC_URL: http://localhost:8000
        run: |
          pip install -r requirements/development.txt
          python manage.py migrate --noinput
          python manage.py seed
          nohup python manage.py runserver 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/v1/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "true"
      - name: API log
        if: failure()
        run: cat /tmp/api.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
